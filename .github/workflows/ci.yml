name: release-validation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  python-and-bundles:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglfw3 python3-tk
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-test.txt
          python -m pip install tron2_mujoco_sim/limxsdk-lowlevel/python3/amd64/*.whl
      - name: Fresh-checkout tests and all sixteen bundle validators
        run: python -m pytest -q
      - name: Published tree policy
        run: python scripts/check_release_tree.py
